name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: false

      - name: Regenerate Pristine iOS Folder
        run: |
          # 1. Completely delete the out-of-sync iOS folder
          rm -rf ios
          
          # 2. Generate a brand new iOS folder perfectly matched to Flutter 3.27.4
          flutter create --platforms=ios .
          
          # 3. Enforce the iOS 15.5 target required by Firebase and mobile_scanner
          sed -i '' "s/platform :ios, .*/platform :ios, '15.5'/g" ios/Podfile
          find ios -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9][0-9]*\.[0-9]*/IPHONEOS_DEPLOYMENT_TARGET = 15.5/g' {} +

      - name: Build Unsigned iOS Application
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload and IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r CocoTradeERP.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CocoTradeERP-iPad
          path: CocoTradeERP.ipa