name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Enforce iOS 13.0 Target Across All Configs
        run: |
          # Force 13.0 in Podfile
          sed -i '' "s/platform :ios, .*/platform :ios, '13.0'/g" ios/Podfile || true
          
          # Force 13.0 everywhere in Xcode project configuration
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9][0-9]*\.[0-9]*/IPHONEOS_DEPLOYMENT_TARGET = 13.0/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Clean and Prepare Workspace
        run: |
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods Podfile.lock .symlinks build
          cd ..

      - name: Build Unsigned iOS Application
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload and IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r CocoTradeERP.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CocoTradeERP-iPad
          path: CocoTradeERP.ipa