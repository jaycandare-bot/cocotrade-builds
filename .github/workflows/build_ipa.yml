name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Configure iOS Target and Build Environment
        run: |
          # 1. Update Podfile platform
          sed -i '' "s/platform :ios, .*/platform :ios, '13.0'/g" ios/Podfile || true
          
          # 2. Update all occurrences in Xcode project configuration
          find ios -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9][0-9]*\.[0-9]*/IPHONEOS_DEPLOYMENT_TARGET = 13.0/g' {} +

          # 3. Clean workspace completely
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods Podfile.lock .symlinks build
          cd ..

      - name: Build Unsigned iOS Application
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "13.0"
        run: |
          flutter build ios --release --no-codesign --config-only
          cd ios
          pod install --repo-update
          cd ..
          flutter build ios --release --no-codesign

      - name: Package Payload and IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r CocoTradeERP.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CocoTradeERP-iPad
          path: CocoTradeERP.ipa