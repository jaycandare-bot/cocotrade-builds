name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Prepare Clean Workspace
        run: |
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods Podfile.lock .symlinks build
          cd ..

      - name: Lock Deployment Target to 15.5
        run: |
          # 1. Force 15.5 in Podfile platform
          sed -i '' "s/platform :ios, .*/platform :ios, '15.5'/g" ios/Podfile || true

          # 2. Update all occurrences of MinimumOSVersion in every plist under ios
          find ios -name "*.plist" -exec plutil -replace MinimumOSVersion -string "15.5" {} + || true

          # 3. Force IPHONEOS_DEPLOYMENT_TARGET in project.pbxproj to 15.5
          find ios -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9][0-9]*\.[0-9]*/IPHONEOS_DEPLOYMENT_TARGET = 15.5/g' {} +

          # 4. Install pods with repo update
          cd ios
          pod install --repo-update
          cd ..

      - name: Build Unsigned iOS Application
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload and IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r CocoTradeERP.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CocoTradeERP-iPad
          path: CocoTradeERP.ipa