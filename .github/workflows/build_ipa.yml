name: Build iOS IPA (Manual Sideloadly)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iPad IPA
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Pre-create iOS Build Directories
        run: mkdir -p build/ios/SourcePackages

      - name: Configure Manual Signing & Bypass Team Check
        run: |
          python3 -c '
          with open("ios/Runner.xcodeproj/project.pbxproj", "r") as f:
              content = f.read()

          # 1. Switch from Automatic to Manual signing so Xcode never looks for provisioning profiles
          content = content.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;")

          # 2. Inject dummy team to pass Flutter check while completely disabling codesign
          replacement = """buildSettings = {
          \t\t\t\tCODE_SIGNING_ALLOWED = NO;
          \t\t\t\tCODE_SIGNING_REQUIRED = NO;
          \t\t\t\tCODE_SIGN_IDENTITY = "";
          \t\t\t\tDEVELOPMENT_TEAM = "DUMMYTEAM1";
          \t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "";"""
          content = content.replace("buildSettings = {", replacement)

          with open("ios/Runner.xcodeproj/project.pbxproj", "w") as f:
              f.write(content)
          '
          # 3. Enforce no-codesign in Flutter Release configuration
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r CocoTradeERP-iPad.ipa Payload

      - name: Upload iPad IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CocoTradeERP-iPad
          path: CocoTradeERP-iPad.ipa
          retention-days: 7