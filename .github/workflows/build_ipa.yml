name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Prepare Clean Workspace
        run: |
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods Podfile.lock .symlinks build
          cd ..

      - name: Lock Deployment Target to 13.0
        run: |
          # Overwrite all occurrences of MinimumOSVersion in every plist under ios
          find ios -name "*.plist" -exec plutil -replace MinimumOSVersion -string "13.0" {} + || true

          # Force IPHONEOS_DEPLOYMENT_TARGET in project.pbxproj
          find ios -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9][0-9]*\.[0-9]*/IPHONEOS_DEPLOYMENT_TARGET = 13.0/g' {} +

          # Run pod install with explicit platform repo update
          cd ios
          pod install --repo-update
          cd ..

      - name: Build Unsigned iOS Application
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload and IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r CocoTradeERP.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CocoTradeERP-iPad
          path: CocoTradeERP.ipa