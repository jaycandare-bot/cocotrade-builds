name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Clean & Enforce iOS 13.0 Everywhere
        run: |
          # 1. Update Podfile platform header
          sed -i '' "s/platform :ios, .*/platform :ios, '13.0'/g" ios/Podfile || true

          # 2. Update Xcode project deployment targets
          find ios -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9][0-9]*\.[0-9]*/IPHONEOS_DEPLOYMENT_TARGET = 13.0/g' {} +

          # 3. Clean environment
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods Podfile.lock .symlinks build
          cd ..

      - name: Build Unsigned iOS Application
        run: |
          # Build with deployment target override passed directly to Xcode
          flutter build ios --release --no-codesign --extra-gen-snapshot-options=--save-debugging-info

      - name: Package Payload and IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r CocoTradeERP.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CocoTradeERP-iPad
          path: CocoTradeERP.ipa