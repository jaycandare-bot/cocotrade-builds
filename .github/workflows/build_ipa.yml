name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: false

      - name: Repair Original iOS Project
        run: |
          cat << 'EOF' > ios/Runner/AppDelegate.swift
          import UIKit
          import Flutter

          @UIApplicationMain
          @objc class AppDelegate: FlutterAppDelegate {
            override func application(
              _ application: UIApplication,
              didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
            ) -> Bool {
              GeneratedPluginRegistrant.register(with: self)
              return super.application(application, didFinishLaunchingWithOptions: launchOptions)
            }
          }
          EOF

          cat << 'EOF' > ios/Runner/SceneDelegate.swift
          import UIKit
          import Flutter

          @available(iOS 13.0, *)
          class SceneDelegate: UIResponder, UIWindowSceneDelegate {
              var window: UIWindow?
          }
          EOF

          plutil -remove UIApplicationSceneManifest ios/Runner/Info.plist || true

      - name: Lock Target, Fix Linkage, and Inject Privacy Strings
        run: |
          sed -i '' "s/use_frameworks!/use_frameworks! :linkage => :static/g" ios/Podfile || true
          
          plutil -insert NSCameraUsageDescription -string "Required for barcode and document scanning" ios/Runner/Info.plist || true
          plutil -insert NSPhotoLibraryUsageDescription -string "Required for file backups" ios/Runner/Info.plist || true
          plutil -insert NSMicrophoneUsageDescription -string "Required for camera module" ios/Runner/Info.plist || true
          
          sed -i '' "s/platform :ios, .*/platform :ios, '15.5'/g" ios/Podfile || true
          find ios -name "*.plist" -exec plutil -replace MinimumOSVersion -string "15.5" {} + || true
          find ios -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9][0-9]*\.[0-9]*/IPHONEOS_DEPLOYMENT_TARGET = 15.5/g' {} +
          
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods Podfile.lock .symlinks build
          pod install --repo-update
          cd ..

      - name: Build Unsigned iOS Application
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload and Inject Firebase Config
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          
          # Force inject the Firebase config directly into the app bundle root
          cp ios/Runner/GoogleService-Info.plist Payload/Runner.app/GoogleService-Info.plist || true
          
          zip -r CocoTradeERP.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CocoTradeERP-iPad
          path: CocoTradeERP.ipa