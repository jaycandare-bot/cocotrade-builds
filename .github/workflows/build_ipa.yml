name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: false

      - name: Revert Experimental iOS Multi-Window
        run: |
          # 1. Restore the standard, stable single-window AppDelegate
          cat << 'EOF' > ios/Runner/AppDelegate.swift
          import UIKit
          import Flutter

          @UIApplicationMain
          @objc class AppDelegate: FlutterAppDelegate {
            override func application(
              _ application: UIApplication,
              didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
            ) -> Bool {
              GeneratedPluginRegistrant.register(with: self)
              return super.application(application, didFinishLaunchingWithOptions: launchOptions)
            }
          }
          EOF

          # 2. Delete the unsupported experimental SceneDelegate
          rm -f ios/Runner/SceneDelegate.swift

          # 3. Safely strip the Scene Manifest from Info.plist
          plutil -remove UIApplicationSceneManifest ios/Runner/Info.plist || true

      - name: Lock Target & Prepare Workspace
        run: |
          # Enforce iOS 15.5 across all Apple config files
          sed -i '' "s/platform :ios, .*/platform :ios, '15.5'/g" ios/Podfile || true
          find ios -name "*.plist" -exec plutil -replace MinimumOSVersion -string "15.5" {} + || true
          find ios -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9][0-9]*\.[0-9]*/IPHONEOS_DEPLOYMENT_TARGET = 15.5/g' {} +
          
          # Clean and install pods
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods Podfile.lock .symlinks build
          pod install --repo-update
          cd ..

      - name: Build Unsigned iOS Application
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload and IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r CocoTradeERP.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CocoTradeERP-iPad
          path: CocoTradeERP.ipa